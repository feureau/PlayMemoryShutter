plugins {
    id 'com.android.application'
}

android {
    namespace 'com.playmemoryshutter'
    compileSdk 34

    defaultConfig {
        applicationId "com.playmemoryshutter"
        // Target Sony Camera API levels
        minSdk 10
        targetSdk 15
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // OpenMemories Framework for PMCA support
    implementation 'com.github.ma1co.OpenMemories-Framework:framework:-SNAPSHOT'
    compileOnly 'com.github.ma1co.OpenMemories-Framework:stubs:-SNAPSHOT'
}
